# --- Banco Quetzal ---
ServerTokens Prod
ServerSignature Off

# IP real del visitante detrás del proxy de Render
RemoteIPHeader X-Forwarded-For

# Log de acceso en formato "combined" para GoAccess (además del log estándar que Render muestra)
LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combinado
CustomLog /var/log/apache2/banco_access.log combinado

<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>

ErrorDocument 404 /404.php
