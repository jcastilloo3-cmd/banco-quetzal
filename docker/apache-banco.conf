# --- Banco Quetzal ---
ServerTokens Prod
ServerSignature Off

# IP real del visitante detrás del proxy de Render
RemoteIPHeader X-Forwarded-For

# Formato "combined" con la IP real; el CustomLog que escribe banco_access.log para GoAccess
# se agrega dentro del VirtualHost (ver Dockerfile), porque un CustomLog global no se hereda.
LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combinado

<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>

ErrorDocument 404 /404.php
