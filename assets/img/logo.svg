<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Banco Quetzal" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11806a"/>
      <stop offset="1" stop-color="#074236"/>
    </linearGradient>
    <linearGradient id="pluma" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fd29a"/>
      <stop offset="1" stop-color="#0f9a73"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="56" fill="url(#fondo)"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="#e1b93c" stroke-width="2.5"/>
  <!-- Letra Q -->
  <circle cx="56" cy="54" r="24" fill="none" stroke="#f3d27a" stroke-width="9"/>
  <!-- Cola de la Q en forma de pluma de quetzal -->
  <path d="M66 68 C 78 80, 88 88, 100 104 C 86 96, 74 88, 62 76 Z" fill="url(#pluma)" stroke="#f3d27a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M68 72 C 78 82, 86 90, 94 99" fill="none" stroke="#e8fff5" stroke-width="1.5" stroke-linecap="round" opacity=".8"/>
  <!-- Pecho rojo del quetzal -->
  <circle cx="56" cy="54" r="7" fill="#d2374a"/>
</svg>
